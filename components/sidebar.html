<!-- Reusable Animated Sidebar Component -->
<!-- Add this CSS to your page's <style> section -->
<style id="sidebar-styles">
    /* Sidebar animations */
    .sidebar {
        transition: transform 0.3s ease-in-out, width 0.3s ease-in-out;
    }
    
    .sidebar-hidden {
        transform: translateX(-100%);
    }
    
    @media (max-width: 768px) {
        .sidebar {
            position: fixed;
            z-index: 50;
            height: 100vh;
        }
    }
    
    /* Smooth hover effects */
    .nav-link {
        transition: all 0.2s ease-in-out;
        position: relative;
    }
    
    .nav-link:hover {
        transform: translateX(4px);
    }
    
    .nav-link.active::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 4px;
        height: 70%;
        background: #13b6ec;
        border-radius: 0 4px 4px 0;
    }
    
    /* Overlay for mobile */
    .sidebar-overlay {
        transition: opacity 0.3s ease-in-out;
    }
</style>

<!-- Add this JavaScript to your page before closing </body> -->
<script id="sidebar-script">
    // ===== SIDEBAR TOGGLE FUNCTIONALITY =====
    (function() {
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const menuToggle = document.getElementById('menuToggle');
        const closeSidebarBtn = document.getElementById('closeSidebar');
        
        // Set active link based on current page
        const currentPage = window.location.pathname.split('/').pop().replace('.html', '') || 'home';
        const navLinks = document.querySelectorAll('.nav-link');
        
        navLinks.forEach(link => {
            const page = link.getAttribute('data-page');
            if (page === currentPage) {
                link.classList.add('active', 'bg-primary/10', 'text-primary', 'font-bold');
                link.classList.remove('text-gray-700', 'dark:text-gray-300', 'font-medium');
            }
        });
        
        // Open sidebar on mobile
        if (menuToggle) {
            menuToggle.addEventListener('click', () => {
                sidebar.classList.remove('sidebar-hidden');
                sidebarOverlay.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            });
        }
        
        // Close sidebar function
        function closeSidebarFunc() {
            sidebar.classList.add('sidebar-hidden');
            sidebarOverlay.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }
        
        // Close sidebar on mobile
        if (closeSidebarBtn) {
            closeSidebarBtn.addEventListener('click', closeSidebarFunc);
        }
        
        if (sidebarOverlay) {
            sidebarOverlay.addEventListener('click', closeSidebarFunc);
        }
        
        // Close sidebar on route navigation (mobile)
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth < 768) {
                    closeSidebarFunc();
                }
            });
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                sidebar.classList.remove('sidebar-hidden');
                sidebarOverlay.classList.add('hidden');
                document.body.style.overflow = 'auto';
            } else {
                if (!sidebarOverlay.classList.contains('hidden')) {
                    return; // Keep sidebar open if user opened it
                }
                sidebar.classList.add('sidebar-hidden');
            }
        });
        
        // Initialize sidebar state on mobile
        if (window.innerWidth < 768) {
            sidebar.classList.add('sidebar-hidden');
        }
    })();
</script>
