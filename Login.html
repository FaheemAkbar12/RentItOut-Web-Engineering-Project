<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RentItOut - Login Page</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Clerk Authentication Library -->
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="YOUR_CLERK_PUBLISHABLE_KEY"
  src="https://[your-clerk-frontend-api].clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
  type="text/javascript"
></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#13b6ec",
            "background-light": "#f6f8f8",
            "background-dark": "#101d22",
          },
          fontFamily: {
            "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="flex flex-1 justify-center">
<div class="layout-content-container flex flex-col w-full flex-1">
<div class="grid grid-cols-1 lg:grid-cols-2 min-h-screen">
<!-- Left Column: Image & Branding -->
<div class="relative hidden lg:flex flex-col justify-between p-12 bg-center bg-no-repeat bg-cover" style='background-image: url("https://images.unsplash.com/photo-1556740749-887f6717d7e4?q=80&w=2070&auto=format&fit=crop");'>
<div class="absolute inset-0 bg-black/40"></div>
<div class="relative z-10 flex items-center gap-3">
<span class="material-symbols-outlined text-white text-4xl">
                  travel_explore
                </span>
<h1 class="text-white text-2xl font-bold">RentItOut</h1>
</div>
<div class="relative z-10">
<p class="text-white text-4xl font-bold leading-tight">Share More. <br/>Own Less.</p>
<p class="text-white/80 text-lg mt-2">Join a community of renters and lenders today.</p>
</div>
</div>
<!-- Right Column: Login Form -->
<div class="flex flex-col items-center justify-center w-full bg-white dark:bg-background-dark py-12 px-4 sm:px-6 lg:px-8">
<div class="w-full max-w-md space-y-8">
<!-- Header -->
<div class="flex flex-col gap-3">
<p class="text-[#111618] dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">Welcome Back</p>
<p class="text-[#617f89] dark:text-gray-400 text-base font-normal leading-normal">Log in to continue your RentItOut journey.</p>
</div>
<!-- Form -->
<div class="flex flex-col gap-6">
<!-- Email Field -->
<label class="flex flex-col w-full">
<p class="text-[#111618] dark:text-gray-200 text-base font-medium leading-normal pb-2">Email or Username</p>
<div class="flex w-full flex-1 items-stretch rounded-xl">
<input id="emailInput" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#111618] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe3e6] dark:border-gray-700 bg-white dark:bg-background-dark/50 h-14 placeholder:text-[#617f89] dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Enter your email or username" value=""/>
</div>
<p id="emailError" class="text-red-500 text-sm mt-1 hidden">Please enter your email or username</p>
</label>
<!-- Password Field -->
<div class="flex flex-col w-full">
<div class="flex justify-between items-center pb-2">
<p class="text-[#111618] dark:text-gray-200 text-base font-medium leading-normal">Password</p>
<a class="text-primary text-sm font-medium leading-normal underline" href="#">Forgot Password?</a>
</div>
<div class="flex w-full flex-1 items-stretch rounded-xl">
<input id="passwordInput" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-xl text-[#111618] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe3e6] dark:border-gray-700 bg-white dark:bg-background-dark/50 h-14 placeholder:text-[#617f89] dark:placeholder:text-gray-500 p-[15px] border-r-0 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
<div class="text-[#617f89] dark:text-gray-400 flex border border-[#dbe3e6] dark:border-gray-700 bg-white dark:bg-background-dark/50 items-center justify-center px-4 rounded-r-xl border-l-0 cursor-pointer">
<span class="material-symbols-outlined text-2xl">visibility</span>
</div>
</div>
<p id="passwordError" class="text-red-500 text-sm mt-1 hidden">Please enter your password</p>
</div>
<!-- Login Button -->
<button class="flex items-center justify-center text-center font-bold text-base h-14 w-full rounded-xl bg-primary text-white hover:bg-primary/90 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-background-dark mt-4">
                    Log In
                  </button>
<!-- Sign Up Link -->
<p class="text-center text-[#617f89] dark:text-gray-400 text-base font-normal leading-normal">
                    Don't have an account? <a class="font-bold text-primary hover:underline" href="signup.html">Sign Up</a>
</p>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
<script>
  // Initialize Clerk
  let clerk;
  
  window.addEventListener('load', async () => {
    try {
      // Note: Replace 'YOUR_CLERK_PUBLISHABLE_KEY' in the script tag above with your actual Clerk publishable key
      // You can get this from: https://dashboard.clerk.com/
      
      clerk = window.Clerk;
      if (clerk) {
        await clerk.load();
        
        // Check if user is already signed in
        if (clerk.user) {
          console.log('User already signed in:', clerk.user);
          window.location.href = 'home.html';
          return;
        }
      }
    } catch (error) {
      console.error('Clerk initialization error:', error);
    }
  });
  
  // Password visibility toggle
  const passwordInput = document.getElementById('passwordInput');
  const visibilityIcon = document.querySelector('.material-symbols-outlined');
  
  if (visibilityIcon && passwordInput) {
    visibilityIcon.parentElement.addEventListener('click', function() {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        visibilityIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        visibilityIcon.textContent = 'visibility';
      }
    });
  }
  
  // Form validation and submission with Clerk
  const loginButton = document.querySelector('button');
  const emailInput = document.getElementById('emailInput');
  const emailError = document.getElementById('emailError');
  const passwordError = document.getElementById('passwordError');
  
  loginButton.addEventListener('click', async function(e) {
    e.preventDefault();
    
    // Reset error messages
    emailError.classList.add('hidden');
    passwordError.classList.add('hidden');
    emailInput.classList.remove('border-red-500');
    passwordInput.classList.remove('border-red-500');
    
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    
    let hasError = false;
    
    if (!email) {
      emailError.textContent = 'Please enter your email or username';
      emailError.classList.remove('hidden');
      emailInput.classList.add('border-red-500');
      emailInput.focus();
      hasError = true;
    }
    
    if (!password) {
      passwordError.textContent = 'Please enter your password';
      passwordError.classList.remove('hidden');
      passwordInput.classList.add('border-red-500');
      if (!hasError) {
        passwordInput.focus();
      }
      hasError = true;
    }
    
    if (hasError) {
      return;
    }
    
    // Disable button during authentication
    loginButton.disabled = true;
    loginButton.textContent = 'Logging in...';
    loginButton.classList.add('opacity-50', 'cursor-not-allowed');
    
    try {
      if (!clerk) {
        throw new Error('Clerk not initialized. Please configure your Clerk publishable key.');
      }
      
      // Sign in with Clerk using email and password
      const signInAttempt = await clerk.client.signIn.create({
        identifier: email,
        password: password,
      });
      
      if (signInAttempt.status === 'complete') {
        // Sign in successful
        await clerk.setActive({ session: signInAttempt.createdSessionId });
        console.log('Login successful with Clerk:', clerk.user);
        
        // Store user data in localStorage if needed
        localStorage.setItem('userEmail', clerk.user.primaryEmailAddress.emailAddress);
        localStorage.setItem('userId', clerk.user.id);
        
        // Redirect to home page
        window.location.href = 'home.html';
      } else {
        // Sign in requires additional steps (2FA, etc.)
        console.log('Additional authentication required:', signInAttempt);
        emailError.textContent = 'Additional authentication required. Please check your email.';
        emailError.classList.remove('hidden');
      }
    } catch (error) {
      console.error('Clerk authentication error:', error);
      
      // Handle specific Clerk errors
      let errorMessage = 'Login failed. Please check your credentials.';
      
      if (error.errors && error.errors.length > 0) {
        const clerkError = error.errors[0];
        
        switch (clerkError.code) {
          case 'form_identifier_not_found':
            errorMessage = 'Account not found. Please check your email or sign up.';
            emailError.textContent = errorMessage;
            emailError.classList.remove('hidden');
            emailInput.classList.add('border-red-500');
            break;
          case 'form_password_incorrect':
            errorMessage = 'Incorrect password. Please try again.';
            passwordError.textContent = errorMessage;
            passwordError.classList.remove('hidden');
            passwordInput.classList.add('border-red-500');
            break;
          case 'session_exists':
            // User already logged in
            window.location.href = 'home.html';
            return;
          default:
            errorMessage = clerkError.longMessage || clerkError.message || errorMessage;
            emailError.textContent = errorMessage;
            emailError.classList.remove('hidden');
        }
      } else {
        emailError.textContent = errorMessage;
        emailError.classList.remove('hidden');
      }
    } finally {
      // Re-enable button
      loginButton.disabled = false;
      loginButton.textContent = 'Log In';
      loginButton.classList.remove('opacity-50', 'cursor-not-allowed');
    }
  });
  
  // Clear error message on input
  emailInput.addEventListener('input', function() {
    if (this.value.trim()) {
      emailError.classList.add('hidden');
      this.classList.remove('border-red-500');
    }
  });
  
  passwordInput.addEventListener('input', function() {
    if (this.value.trim()) {
      passwordError.classList.add('hidden');
      this.classList.remove('border-red-500');
    }
  });
  
  // Forgot password link with Clerk
  const forgotPasswordLink = document.querySelector('a.text-primary');
  if (forgotPasswordLink) {
    forgotPasswordLink.addEventListener('click', async function(e) {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      
      if (!email) {
        emailError.textContent = 'Please enter your email address first';
        emailError.classList.remove('hidden');
        emailInput.focus();
        return;
      }
      
      try {
        if (!clerk) {
          throw new Error('Clerk not initialized');
        }
        
        // Send password reset email via Clerk
        await clerk.client.signIn.create({
          strategy: 'reset_password_email_code',
          identifier: email,
        });
        
        emailError.textContent = 'Password reset link sent to ' + email;
        emailError.classList.remove('hidden');
        emailError.classList.remove('text-red-500');
        emailError.classList.add('text-green-500');
        
        console.log('Password reset requested for:', email);
        
        // Reset color back after 5 seconds
        setTimeout(() => {
          emailError.classList.add('text-red-500');
          emailError.classList.remove('text-green-500');
          emailError.classList.add('hidden');
        }, 5000);
      } catch (error) {
        console.error('Password reset error:', error);
        emailError.textContent = 'Failed to send reset email. Please try again.';
        emailError.classList.remove('hidden');
      }
    });
  }
</script>
</body></html>
